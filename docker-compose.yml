services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: rakshak
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rakshak"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/rakshak
      DB_USERNAME: postgres
      DB_PASSWORD: password
    depends_on:
      postgres:
        condition: service_healthy

  web-complaint-portal:
    build: ./web-complaint-portal
    ports:
      - "3000:80"
    depends_on:
      - backend

  cop-dashboard:
    build: ./cop-dashboard
    ports:
      - "3001:80"
    depends_on:
      - backend

volumes:
  pgdata:
